<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java FPS Shooter — Web</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #87ccec;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
    user-select: none;
    line-height: 1.5;
  }
  #hud .practice { opacity: 0.75; font-size: 14px; }

  #scoreboard {
    position: fixed;
    top: 16px;
    right: 16px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    text-align: right;
    pointer-events: none;
    user-select: none;
  }

  #status {
    position: fixed;
    bottom: 16px;
    left: 16px;
    color: #fff;
    opacity: 0.7;
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    pointer-events: none;
    user-select: none;
  }

  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 2px rgba(0,0,0,0.8);
  }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after  { top: 8px; left: 0; width: 18px; height: 2px; }

  #hitmarker {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    pointer-events: none;
    opacity: 0;
    transform: scale(1.5);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out;
  }
  #hitmarker.show {
    opacity: 1;
    transform: scale(1);
  }
  #hitmarker::before, #hitmarker::after {
    content: "";
    position: absolute;
    top: 12px;
    left: 1px;
    width: 24px;
    height: 2px;
    background: #fff;
    box-shadow: 0 0 2px rgba(0,0,0,0.9);
  }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }

  #deathOverlay {
    position: fixed;
    inset: 0;
    background: rgba(120, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease-out;
  }
  #deathOverlay.show { opacity: 1; }

  #matchBanner {
    position: fixed;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    color: #ffd54a;
    font-size: 42px;
    font-weight: 800;
    text-shadow: 0 3px 10px rgba(0,0,0,0.7);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
    text-align: center;
  }
  #matchBanner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    user-select: none;
  }
  #overlay h1 { margin: 0 0 8px; font-size: 32px; }
  #overlay p { margin: 4px 0; opacity: 0.85; font-size: 15px; }
  #overlay .hint { margin-top: 10px; font-size: 13px; opacity: 0.6; }

  #nameInput {
    margin-top: 20px;
    padding: 8px 12px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    width: 220px;
    text-align: center;
  }

  #startBtn {
    margin-top: 14px;
    padding: 10px 26px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 6px;
    border: none;
    background: #e6c34a;
    color: #1a1400;
    cursor: pointer;
  }
  #startBtn:hover { background: #f2d15c; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="hud">
  Kills: <span id="kills">0</span> / <span id="killLimit">10</span>
  &nbsp;•&nbsp; Players: <span id="playerCount">1</span>
  <div class="practice">Practice score: <span id="score">0</span></div>
</div>
<div id="scoreboard"></div>
<div id="status"></div>

<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="deathOverlay">Eliminated — respawning…</div>
<div id="matchBanner"></div>

<div id="overlay">
  <h1>Java FPS Shooter — PvP</h1>
  <p><strong>W A S D</strong> move &nbsp;•&nbsp; <strong>Mouse</strong> look &nbsp;•&nbsp; <strong>Space</strong> / <strong>Shift</strong> up / down</p>
  <p><strong>Click</strong> to shoot &nbsp;•&nbsp; first to <strong>10 kills</strong> wins the lobby</p>
  <input id="nameInput" type="text" maxlength="16" placeholder="Your name" />
  <button id="startBtn">Click to Play</button>
  <div class="hint">Red cubes are practice targets — other players are the real fight.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
