<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>screenshot helper</title>
<!--
  Visual check helper (not an assertion test): shows the loadout screen and an
  in-game first-person view side by side so a headless screenshot can be
  inspected by eye.  ?weapon=N picks the weapon (default 0).
    chrome --headless=new --virtual-time-budget=12000 --window-size=1300,400 --screenshot=out.png http://localhost:8080/tests/shot.html?weapon=0
-->
<style>
  body { margin: 0; background: #222; display: flex; }
  iframe { width: 650px; height: 400px; border: 0; }
</style>
</head>
<body>
<iframe id="a" src="/"></iframe>
<iframe id="b" src="/"></iframe>
<script>
(async function () {
  const weapon = new URLSearchParams(location.search).get("weapon") || "0";
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function ready(frame) {
    for (let i = 0; i < 200; i++) {
      const d = frame.contentDocument;
      if (d && d.getElementById("modeSelect") && d.body.querySelector(":scope > canvas") && !d.getElementById("loading")) return;
      await wait(100);
    }
  }
  const a = document.getElementById("a"), b = document.getElementById("b");
  await Promise.all([ready(a), ready(b)]);
  // A: stop on the loadout screen
  a.contentDocument.getElementById("trainingModeBtn").click();
  // B: play Aim Training with the chosen weapon
  const bd = b.contentDocument;
  bd.getElementById("trainingModeBtn").click();
  bd.querySelector('.weaponCard[data-weapon="' + weapon + '"]').click();
  bd.getElementById("startTrainingBtn").click();
  await wait(300);
  const canvas = bd.body.querySelector(":scope > canvas");
  Object.defineProperty(bd, "pointerLockElement", { get: () => canvas, configurable: true });
  bd.dispatchEvent(new b.contentWindow.Event("pointerlockchange"));
  await wait(1500);
})();
</script>
</body>
</html>
